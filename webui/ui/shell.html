  <div class="waves">

    <svg class="w2" viewBox="0 0 2400 300" preserveAspectRatio="none"><path d="M0 190 C 240 130,480 250,720 190 S 1200 130,1440 190 S 1920 250,2160 190 S 2400 150,2400 190 V300 H0 Z"/></svg>
    <svg class="w1" viewBox="0 0 2400 300" preserveAspectRatio="none"><path d="M0 230 C 300 180,600 280,900 230 S 1500 180,1800 230 S 2250 280,2400 235 V300 H0 Z"/></svg>
  </div>
  <svg class="branch" viewBox="0 0 600 420" aria-hidden="true">
    <path d="M596 410 C 470 350,392 300,300 210 C 236 148,168 120,84 108"/>
    <path d="M300 210 C 268 150,236 128,188 116"/>
    <path d="M420 314 C 396 258,376 232,342 206"/>
    <circle cx="84" cy="108" r="9"/><circle cx="188" cy="116" r="11"/><circle cx="243" cy="150" r="7"/>
    <circle cx="342" cy="206" r="12"/><circle cx="386" cy="252" r="8"/><circle cx="452" cy="330" r="10"/>
    <circle cx="120" cy="112" r="6"/><circle cx="300" cy="212" r="6"/><circle cx="520" cy="372" r="7"/>

</div>

<div class="app">
  <aside class="side">
    <div class="brand" id="brand" title="双击可改软件名">
      <div class="logo" id="brandLogo">Q</div>
      <div class="btxt" style="min-width:0">
        <div class="bname" id="brandName">Qwen 生图控制台</div>
        <div class="bsub">本地生图 · API 服务</div>
      </div>
    </div>

    <div class="nav-tools">
      <div class="seg" style="flex:1">
        <button id="btnFlat" onclick="MIC.nav.setLayout('flat')"><svg class="ic s"><use href="#i-rows"/></svg><span>平铺</span></button>
        <button id="btnTree" onclick="MIC.nav.setLayout('tree')"><svg class="ic s"><use href="#i-tree"/></svg><span>分组</span></button>
      </div>
      <button class="iconbtn" id="navOpt" onclick="MIC.nav.menu(event)" title="导航选项"><svg class="ic"><use href="#i-dots"/></svg></button>
    </div>

    <nav class="tree" id="tree"></nav>

    <div class="sidefoot">
      <span id="verTag" title="版本">v-</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="grow"></div>
      <div class="pills" id="pills"></div>
      <button class="btn sm gho" onclick="MIC.theme.pop(event)" title="外观"><svg class="ic s"><use href="#i-palette"/></svg>外观</button>
      <button class="iconbtn" onclick="MIC.nav.toggleMin()" title="收起侧栏"><svg class="ic"><use href="#i-collapse"/></svg></button>
      <span class="wctl">
        <button class="wbtn" onclick="MIC.win.min()" title="最小化"><svg class="ic"><use href="#i-wmin"/></svg></button>
        <button class="wbtn" id="winMax" onclick="MIC.win.max()" title="最大化"><svg class="ic"><use href="#i-wmax"/></svg></button>
        <button class="wbtn wc-close" onclick="MIC.win.close()" title="关闭"><svg class="ic"><use href="#i-close"/></svg></button>
      </span>
    </header>
    <div class="content"><div class="inner" id="view"></div></div>
  </div>
</div>

<div class="layer hide" id="menu"></div>
<div class="layer hide" id="pop"></div>
<div class="toast hide" id="toast"></div>

<div id="rzg">
  <div class="rz" data-edge="n"></div><div class="rz" data-edge="s"></div>
  <div class="rz" data-edge="e"></div><div class="rz" data-edge="w"></div>
  <div class="rz" data-edge="ne"></div><div class="rz" data-edge="nw"></div>
  <div class="rz" data-edge="se"></div><div class="rz" data-edge="sw"></div>
</div>

<script>/*__JS__*/</script>
</body>
</html>
